name: Markpad
options:
  bundleIdPrefix: com.antoinedebroye
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  MarkpadCore:
    path: MarkpadCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.5

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.3"
    CURRENT_PROJECT_VERSION: "6"
    # Off for local builds, and added back by scripts/notarize.sh, which signs everything with
    # --options runtime. Hardened runtime enforces library validation: a loaded framework must
    # carry the same team identity as the process. Sparkle is a separate framework, and two
    # ad-hoc signatures never match, so a hardened ad-hoc build cannot load it — the app dies
    # at launch with "Library not loaded ... different Team IDs". A Developer ID build signs
    # app and framework alike and validates fine, which is why only local builds need this.
    ENABLE_HARDENED_RUNTIME: NO
    # Ad-hoc signing so the project builds and runs on any Mac without a developer
    # account. scripts/notarize.sh overrides this with a Developer ID identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Markpad:
    type: application
    platform: macOS
    sources:
      - path: Markpad
        excludes:
          - "Resources/Mermaid/**"
      # Kept as a folder reference so mermaid.min.js and its host page stay side by side in
      # the bundle, which is what the host page's <script src> expects.
      - path: Markpad/Resources/Mermaid
        type: folder
    dependencies:
      - package: MarkpadCore
        product: MarkpadCore
      - package: Sparkle
        product: Sparkle
      - target: MarkpadQuickLook
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoinedebroye.markpad
        PRODUCT_NAME: Markpad
        CODE_SIGN_ENTITLEMENTS: Markpad/Markpad.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
    info:
      path: Markpad/Info.plist
      properties:
        CFBundleName: Markpad
        CFBundleDisplayName: Markpad
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Antoine Debroye. MIT licensed."
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        ITSAppUsesNonExemptEncryption: false
        # Sparkle. The feed is served from the newest GitHub release, so publishing a release
        # with an appcast.xml asset is all it takes to offer an update — the URL never changes.
        SUFeedURL: https://github.com/antoine-debroye/markpad/releases/latest/download/appcast.xml
        # The EdDSA public key that updates are verified against; the private half lives in the
        # login keychain. Sparkle refuses to install anything it cannot verify, so an empty key
        # disables updating rather than weakening it. Run ./scripts/appcast.sh setup to fill in.
        SUPublicEDKey: "Kf1o7p4lWeAt2unbslMM1r3hoD3eeE6EPKzuojQLW0w="
        SUEnableAutomaticChecks: true
        # Downloads and installs without asking, applying the update on next launch, which is
        # the "just keep it current" behaviour. Set to false to prompt before installing.
        SUAutomaticallyUpdate: true
        # Once a day. Sparkle also checks shortly after launch when a check is overdue.
        SUScheduledCheckInterval: 86400
        # net.daringfireball.markdown is not declared by the system, so Markpad imports it.
        # Without this, the open panel and DocumentGroup treat .md files as unknown.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
                - mkd
                - mdtext
              public.mime-type:
                - text/markdown
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - net.daringfireball.markdown
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.image

  MarkpadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MarkpadTests
    dependencies:
      - target: Markpad
      - package: MarkpadCore
        product: MarkpadCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoinedebroye.markpad.tests
        # Depending on the Markpad target gives this suite an app host, so tests run inside the
        # real app. That means shared singletons are the live ones: never touch
        # NSDocumentController from a test, or it will read — and clear — the developer's own
        # recent documents. Test pure logic with synthetic input instead.
        GENERATE_INFOPLIST_FILE: YES

  MarkpadQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: MarkpadQuickLook
      # The preview is the editor rendered read-only, so the extension compiles the same
      # rendering stack. EditorView is the app's SwiftUI wrapper around it and is not needed
      # here; EditorHost builds the view for both.
      - path: Markpad/Editor
        excludes:
          - "EditorView.swift"
    dependencies:
      - package: MarkpadCore
        product: MarkpadCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoinedebroye.markpad.quicklook
        PRODUCT_NAME: MarkpadQuickLook
        CODE_SIGN_ENTITLEMENTS: MarkpadQuickLook/MarkpadQuickLook.entitlements
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
    info:
      path: MarkpadQuickLook/Info.plist
      properties:
        CFBundleName: MarkpadQuickLook
        CFBundleDisplayName: Markpad Preview
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            # No QLIsDataBasedPreview here, deliberately. That key routes Quick Look to a
            # QLPreviewProvider handing back rendered data, which Quick Look then displays in
            # a web view of its own — the arrangement that scrolled a fixed 120px per notch.
            # Absent, the system builds the principal class as a view controller, and the
            # preview scrolls natively. Adding the key back without also restoring a
            # QLPreviewProvider makes pressing Space show nothing.
            QLSupportedContentTypes:
              - net.daringfireball.markdown
            QLSupportsSearchableItems: false

schemes:
  Markpad:
    build:
      targets:
        Markpad: all
        MarkpadTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarkpadTests
    archive:
      config: Release
